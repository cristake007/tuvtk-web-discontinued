services:
  backend:
    command:
      - python
      - manage.py
      - runserver
      - 0.0.0.0:8000

    environment:
      DJANGO_DEBUG: "true"

  frontend_permissions:
    image: node:24-bookworm-slim

    working_dir: /app

    user: "0:0"

    environment:
      LOCAL_UID: "${LOCAL_UID:-1000}"
      LOCAL_GID: "${LOCAL_GID:-1000}"

    volumes:
      - type: bind
        source: ./frontend
        target: /app

    command:
      - /bin/sh
      - ./scripts/prepare-node-modules.sh

    restart: "no"

  frontend:
    image: node:24-bookworm-slim

    container_name: ${FRONTEND_CONTAINER_NAME:-tuvtk_frontend}

    working_dir: /app

    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"

    environment:
      CHOKIDAR_USEPOLLING: "true"
      NPM_CONFIG_CACHE: /tmp/npm-cache

    volumes:
      - type: bind
        source: ./frontend
        target: /app

    ports:
      - "${FRONTEND_PORT:-5173}:5173"

    depends_on:
      backend:
        condition: service_started
      frontend_permissions:
        condition: service_completed_successfully

    command:
      - /bin/sh
      - ./scripts/start-dev.sh

    init: true
    restart: "no"
