<!doctype html>
<html lang="ro">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Viewer standalone pentru structura frontendului React, API-urilor, backendului Django și fluxurilor de date."
    />
    <title>Frontend, API & Backend Explorer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <button
          aria-controls="route-sidebar"
          aria-expanded="false"
          class="icon-button mobile-only"
          id="sidebar-toggle"
          type="button"
        >
          <span aria-hidden="true">☰</span>
          <span class="sr-only">Deschide lista rutelor</span>
        </button>

        <a class="brand" href="#" id="home-link">
          <span class="brand-mark" aria-hidden="true">R</span>
          <span>
            <strong>Application Structure Explorer</strong>
            <small>Documentație structurală standalone</small>
          </span>
        </a>

        <div class="topbar-meta" aria-live="polite">
          <span class="data-mode" id="data-mode">Se încarcă datele…</span>
          <span class="route-total" id="route-total"></span>
        </div>

        <label class="global-search" for="global-search"><span aria-hidden="true">⌕</span><input autocomplete="off" id="global-search" placeholder="Caută în frontend, API și backend…" type="search" /></label>

        <nav class="topbar-actions mode-navigation" aria-label="Zone viewer">
          <button class="toolbar-button is-active" data-main-mode="frontend" type="button"><span aria-hidden="true">◇</span><span class="desktop-label">Frontend</span></button>
          <button class="toolbar-button" data-main-mode="api" type="button"><span aria-hidden="true">↔</span><span class="desktop-label">API</span></button>
          <button class="toolbar-button" data-main-mode="backend" type="button"><span aria-hidden="true">▦</span><span class="desktop-label">Backend</span></button>
          <button class="toolbar-button" data-main-mode="flow" type="button"><span aria-hidden="true">⇢</span><span class="desktop-label">Data flow</span></button>
          <button class="toolbar-button" data-main-mode="inconsistencies" type="button"><span aria-hidden="true">≠</span><span class="desktop-label">Inconsistențe</span></button>
        </nav>
      </header>

      <div class="workspace">
        <aside class="sidebar" id="route-sidebar">
          <section class="sidebar-mode" data-sidebar-mode="frontend">
            <div class="sidebar-header">
            <label class="search-field" for="route-search">
              <span aria-hidden="true">⌕</span>
              <input
                autocomplete="off"
                id="route-search"
                placeholder="Caută rută sau componentă…"
                type="search"
              />
              <kbd>/</kbd>
            </label>

            <div class="filter-grid">
              <label>
                <span>Modul</span>
                <select id="module-filter">
                  <option value="all">Toate modulele</option>
                </select>
              </label>
              <label>
                <span>Tip pagină</span>
                <select id="type-filter">
                  <option value="all">Toate tipurile</option>
                </select>
              </label>
            </div>

            <div class="filter-summary">
              <span id="filter-count">0 rute</span>
              <button class="text-button" id="clear-filters" type="button">Resetează</button>
            </div>
            </div>

            <nav aria-label="Rute React" class="route-navigation">
              <ol class="route-list" id="route-list"></ol>
            </nav>

            <div class="sidebar-footer sidebar-actions">
              <button class="text-button" data-global-view="patterns" type="button">♻ Structuri repetate</button>
              <button class="text-button" data-global-view="compare" type="button">⇄ Compară pagini <span class="count-badge" id="compare-count">0</span></button>
              <a href="../index.md">Index Markdown</a>
              <a href="../_runtime-comun.md">Runtime comun</a>
              <a href="README.md">Cum regenerez datele?</a>
            </div>
          </section>

          <section class="sidebar-mode" data-sidebar-mode="api" hidden>
            <div class="sidebar-header">
              <label class="search-field" for="api-search"><span aria-hidden="true">⌕</span><input autocomplete="off" id="api-search" placeholder="Caută endpoint, view, serializer…" type="search" /></label>
              <div class="filter-grid">
                <label><span>Aplicație</span><select id="api-app-filter"><option value="all">Toate aplicațiile</option></select></label>
                <label><span>Metodă</span><select id="api-method-filter"><option value="all">Toate metodele</option></select></label>
                <label><span>Categorie</span><select id="api-category-filter"><option value="all">Toate categoriile</option></select></label>
                <label><span>Permission</span><select id="api-permission-filter"><option value="all">Toate permissions</option></select></label>
              </div>
              <label class="problem-toggle"><input id="api-problems-only" type="checkbox" /> Numai cu observații</label>
              <div class="filter-summary"><span id="api-filter-count">0 endpointuri</span><button class="text-button" id="clear-api-filters" type="button">Resetează</button></div>
            </div>
            <nav aria-label="Endpointuri API" class="route-navigation"><ol class="route-list endpoint-list" id="endpoint-list"></ol></nav>
            <div class="sidebar-footer sidebar-actions">
              <button class="text-button" id="open-api-compare" type="button">⇄ Compară endpointuri <span class="count-badge" id="api-compare-count">0</span></button>
              <button class="text-button" id="open-api-findings" type="button">! Observații API</button>
            </div>
          </section>

          <section class="sidebar-mode" data-sidebar-mode="backend" hidden>
            <div class="sidebar-header">
              <label class="search-field" for="backend-search"><span aria-hidden="true">⌕</span><input autocomplete="off" id="backend-search" placeholder="Caută aplicație, model, service…" type="search" /></label>
              <label class="problem-toggle"><input id="backend-problems-only" type="checkbox" /> Numai module cu observații</label>
              <div class="filter-summary"><span id="backend-filter-count">0 aplicații</span><button class="text-button" id="clear-backend-filters" type="button">Resetează</button></div>
            </div>
            <nav aria-label="Aplicații Django" class="route-navigation"><ol class="route-list backend-list" id="backend-list"></ol></nav>
            <div class="sidebar-footer sidebar-actions">
              <button class="text-button" id="open-backend-compare" type="button">⇄ Compară module <span class="count-badge" id="backend-compare-count">0</span></button>
              <button class="text-button" id="open-backend-findings" type="button">! Toate constatările</button>
            </div>
          </section>

          <section class="sidebar-mode" data-sidebar-mode="flow" hidden>
            <div class="sidebar-header">
              <label class="search-field" for="flow-search"><span aria-hidden="true">⌕</span><input autocomplete="off" id="flow-search" placeholder="Caută flux, rută, model…" type="search" /></label>
              <label class="sidebar-select"><span>Pornește explorarea de la</span><select id="flow-start-filter"><option value="endpoint">Endpoint</option><option value="route">Rută React</option><option value="application">Aplicație Django</option><option value="model">Model</option><option value="service">Service</option><option value="task">Celery task</option></select></label>
              <label class="problem-toggle"><input id="flow-problems-only" type="checkbox" /> Numai fluxuri cu observații</label>
              <div class="filter-summary"><span id="flow-filter-count">0 fluxuri</span><button class="text-button" id="clear-flow-filters" type="button">Resetează</button></div>
            </div>
            <nav aria-label="Fluxuri de date" class="route-navigation"><ol class="route-list flow-list" id="flow-list"></ol></nav>
          </section>
        </aside>

        <button aria-label="Închide lista rutelor" class="sidebar-scrim" id="sidebar-scrim" type="button"></button>

        <main class="content" id="content" tabindex="-1">
          <section class="loading-panel" aria-live="polite">
            <div class="loading-spinner" aria-hidden="true"></div>
            <h1>Se pregătește viewerul</h1>
            <p>Sunt încărcate rutele și arborii structurali.</p>
          </section>
        </main>
      </div>
    </div>

    <noscript>
      <div class="noscript">Viewerul necesită JavaScript activat în browser.</div>
    </noscript>
    <script src="app.js" defer></script>
  </body>
</html>
