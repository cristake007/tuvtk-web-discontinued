services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ${BACKEND_CONTAINER_NAME:-tuvtk_backend}

    working_dir: /app

    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"

    env_file:
      - .env

    volumes:
      - type: bind
        source: ./backend
        target: /app

    expose:
      - "8000"

    depends_on:
      db_core:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - |
        exec gunicorn config.wsgi:application \
          --bind "${BACKEND_BIND:-0.0.0.0:8000}" \
          --workers "${GUNICORN_WORKERS:-2}" \
          --threads "${GUNICORN_THREADS:-2}" \
          --timeout "${GUNICORN_TIMEOUT:-60}" \
          --log-level "${GUNICORN_LOG_LEVEL:-info}"

    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ${CELERY_WORKER_CONTAINER_NAME:-tuvtk_celery_worker}

    working_dir: /app

    user: "65534:65534"

    env_file:
      - .env

    volumes:
      - type: bind
        source: ./backend
        target: /app
        read_only: true

    depends_on:
      db_core:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - |
        exec celery -A config worker \
          --loglevel="${CELERY_LOG_LEVEL:-info}" \
          --concurrency="${CELERY_WORKER_CONCURRENCY:-2}" \
          --hostname="worker@%h"

    restart: unless-stopped

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ${CELERY_BEAT_CONTAINER_NAME:-tuvtk_celery_beat}

    working_dir: /app

    user: "65534:65534"

    env_file:
      - .env

    volumes:
      - type: bind
        source: ./backend
        target: /app
        read_only: true

    tmpfs:
      - /tmp

    depends_on:
      db_core:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - |
        exec celery -A config beat \
          --loglevel="${CELERY_LOG_LEVEL:-info}" \
          --schedule=/tmp/tuvtk-celerybeat-schedule

    restart: unless-stopped

  redis:
    image: redis:7-bookworm

    container_name: ${REDIS_CONTAINER_NAME:-tuvtk_redis}

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped

  db_core:
    image: postgres:18-bookworm

    container_name: ${CORE_DB_CONTAINER_NAME:-tuvtk_db_core}

    environment:
      POSTGRES_DB: ${CORE_DB_NAME}
      POSTGRES_USER: ${CORE_DB_USER}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD}

    volumes:
      - core_postgres_data:/var/lib/postgresql

    ports:
      - "127.0.0.1:${CORE_DB_EXPOSED_PORT:-5432}:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${CORE_DB_USER} -d ${CORE_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped

  db_registry:
    image: postgres:18-bookworm

    container_name: ${REGISTRY_DB_CONTAINER_NAME:-tuvtk_db_registry}

    environment:
      POSTGRES_DB: ${REGISTRY_DB_NAME}
      POSTGRES_USER: ${REGISTRY_DB_USER}
      POSTGRES_PASSWORD: ${REGISTRY_DB_PASSWORD}

    volumes:
      - registry_postgres_data:/var/lib/postgresql

    ports:
      - "127.0.0.1:${REGISTRY_DB_EXPOSED_PORT:-5433}:5432"

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${REGISTRY_DB_USER} -d ${REGISTRY_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped

volumes:
  core_postgres_data:
    name: ${CORE_DB_VOLUME_NAME:-tuvtk_core_postgres_data}
  registry_postgres_data:
    name: ${REGISTRY_DB_VOLUME_NAME:-tuvtk_registry_postgres_data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-tuvtk_redis_data}
