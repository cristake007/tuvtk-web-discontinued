services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ${BACKEND_CONTAINER_NAME:-tuvtk_backend}

    working_dir: /app

    user: "999:999"

    env_file:
      - .env

    expose:
      - "8000"

    depends_on:
      db_core:
        condition: service_healthy
      db_registry:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl --fail --silent http://localhost:8000/api/v1/health >/dev/null",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

    command:
      - /bin/sh
      - -c
      - |
        python manage.py collectstatic --noinput
        exec gunicorn config.wsgi:application \
          --bind "${BACKEND_BIND:-0.0.0.0:8000}" \
          --workers "${GUNICORN_WORKERS:-2}" \
          --threads "${GUNICORN_THREADS:-2}" \
          --timeout "${GUNICORN_TIMEOUT:-60}" \
          --log-level "${GUNICORN_LOG_LEVEL:-info}"

    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media

    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: ${NGINX_CONTAINER_NAME:-tuvtk_nginx}

    ports:
      - "${NGINX_PORT:-80}:80"

    depends_on:
      backend:
        condition: service_started

    volumes:
      - staticfiles:/srv/static:ro
      - media:/srv/media:ro

    restart: unless-stopped

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ${CELERY_WORKER_CONTAINER_NAME:-tuvtk_celery_worker}

    working_dir: /app

    user: "999:999"

    env_file:
      - .env

    depends_on:
      db_core:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - |
        exec celery -A config worker \
          --loglevel="${CELERY_LOG_LEVEL:-info}" \
          --concurrency="${CELERY_WORKER_CONCURRENCY:-2}" \
          --hostname="worker@%h"

    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    restart: unless-stopped

  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: ${CELERY_BEAT_CONTAINER_NAME:-tuvtk_celery_beat}

    working_dir: /app

    user: "999:999"

    env_file:
      - .env

    tmpfs:
      - /tmp

    depends_on:
      db_core:
        condition: service_healthy
      redis:
        condition: service_healthy

    command:
      - /bin/sh
      - -c
      - |
        exec celery -A config beat \
          --loglevel="${CELERY_LOG_LEVEL:-info}" \
          --schedule=/tmp/tuvtk-celerybeat-schedule

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /tmp/tuvtk-celerybeat-schedule && find /tmp/tuvtk-celerybeat-schedule -mmin -5 -print -quit | grep -q .",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    restart: unless-stopped

  redis:
    image: redis:7-bookworm

    container_name: ${REDIS_CONTAINER_NAME:-tuvtk_redis}

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1000"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped

  db_core:
    image: postgres:18-bookworm

    container_name: ${CORE_DB_CONTAINER_NAME:-tuvtk_db_core}

    environment:
      POSTGRES_DB: ${CORE_DB_NAME}
      POSTGRES_USER: ${CORE_DB_USER}
      POSTGRES_PASSWORD: ${CORE_DB_PASSWORD}

    volumes:
      - core_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${CORE_DB_USER} -d ${CORE_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped

  db_registry:
    image: postgres:18-bookworm

    container_name: ${REGISTRY_DB_CONTAINER_NAME:-tuvtk_db_registry}

    environment:
      POSTGRES_DB: ${REGISTRY_DB_NAME}
      POSTGRES_USER: ${REGISTRY_DB_USER}
      POSTGRES_PASSWORD: ${REGISTRY_DB_PASSWORD}

    volumes:
      - registry_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${REGISTRY_DB_USER} -d ${REGISTRY_DB_NAME}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

    restart: unless-stopped

volumes:
  core_postgres_data:
    name: ${CORE_DB_VOLUME_NAME:-tuvtk_core_postgres_data}
  registry_postgres_data:
    name: ${REGISTRY_DB_VOLUME_NAME:-tuvtk_registry_postgres_data}
  redis_data:
    name: ${REDIS_VOLUME_NAME:-tuvtk_redis_data}
  staticfiles:
    name: ${STATICFILES_VOLUME_NAME:-tuvtk_staticfiles}
  media:
    name: ${MEDIA_VOLUME_NAME:-tuvtk_media}
