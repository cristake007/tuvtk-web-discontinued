[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "DJ", "UP", "N", "S"]

[tool.ruff.lint.per-file-ignores]
"**/test*.py" = ["S101", "S106", "S107"]
"apps/core/svg.py" = ["S314"]
"apps/course_planner/files.py" = ["S318"]
"apps/course_planner/services.py" = ["S311"]
"apps/firme_onrc/models.py" = ["DJ008"]
"apps/firme_onrc/search_index.py" = ["S608"]
"apps/update_wordpress/client.py" = ["S101", "S311"]
